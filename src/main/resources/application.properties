# ==============================
# 銀行帳戶交易管理系統
# Spring Boot 4.1.1
# ==============================

# 專案名稱
spring.application.name=bank-transaction-system

# Web Server Port
server.port = 8080

# 必須讀取工作目錄 ./config/local-secrets.properties；檔案不存在時將無法按目前設定啟動
spring.config.import=file:./config/local-secrets.properties

# ==========================================
# MySQL 連線設定
# ==========================================

# 資料庫位置與名稱
spring.datasource.url=jdbc:mysql://localhost:3306/bank_transaction_db?connectionTimeZone=Asia/Taipei

# 資料庫使用者
spring.datasource.username=root

# 使用 Spring 屬性佔位符讀取 BANK_DB_PASSWORD；可由外部設定檔提供，不在此寫明密碼
spring.datasource.password=${BANK_DB_PASSWORD}

# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate 設定
# ==========================================

# 不允許 Hibernate 自動建立或修改資料表
spring.jpa.hibernate.ddl-auto=validate

# 不需要輸出 Hibernate SQL
spring.jpa.show-sql=false

# 停用 Open Session in View
spring.jpa.open-in-view=false

# ==========================================
# 日誌設定
# ==========================================

logging.level.com.example.bank=INFO